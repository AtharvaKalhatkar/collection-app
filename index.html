<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/collection-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Daily Collection & Invoicing - Purva Enterprises & Manas Sales">

  <!-- Android / Chrome PWA Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="msapplication-navbutton-color" content="#1E3A8A">

  <!-- iOS Safari PWA Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Collection">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Daily Collection App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* PWA Install Banner Styling */
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 16px;
      right: 16px;
      max-width: 420px;
      margin: 0 auto;
      background: #0F172A;
      border: 1px solid #334155;
      color: #FFFFFF;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 9999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      align-items: center;
      justify-content: space-between;
      animation: pwaSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pwaSlideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .pwa-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }
    .pwa-left img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      flex-shrink: 0;
      border: 1px solid #334155;
    }
    .pwa-text {
      overflow: hidden;
    }
    .pwa-title {
      font-weight: 700;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: ellipsis;
    }
    .pwa-desc {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: ellipsis;
    }
    .pwa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .pwa-btn-install {
      background: #10B981;
      color: #FFFFFF;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .pwa-btn-close {
      background: transparent;
      color: #94A3B8;
      border: none;
      font-size: 16px;
      padding: 4px;
      cursor: pointer;
    }
  </style>
  <!-- In-browser Fast OCR Engine (Preloaded for instant bill scanning) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body style="margin:0; background:#0F172A;">

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner">
    <div class="pwa-left">
      <img src="icons/Icon-192.png" alt="App Icon">
      <div class="pwa-text">
        <div class="pwa-title">Install Collection App</div>
        <div class="pwa-desc">Add to Home Screen for 1-tap fast access</div>
      </div>
    </div>
    <div class="pwa-actions">
      <button class="pwa-btn-install" onclick="window.installPwa()">INSTALL</button>
      <button class="pwa-btn-close" onclick="window.dismissPwaBanner()">✕</button>
    </div>
  </div>

  <script>
    // Register PWA Service Worker for Offline & Installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(function(reg) {
            console.log('Daily Collection PWA ServiceWorker registered');
          })
          .catch(function(err) {
            console.warn('PWA ServiceWorker registration error: ', err);
          });
      });
    }

    // PWA Install Prompt Handler
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent browser's mini-infobar from abruptly appearing
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA: beforeinstallprompt captured!');

      // Check if user has previously dismissed banner in this session
      if (!sessionStorage.getItem('pwa_dismissed')) {
        const banner = document.getElementById('pwa-install-banner');
        if (banner) {
          banner.style.display = 'flex';
        }
      }
    });

    window.installPwa = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('PWA: User accepted install');
          }
          deferredPrompt = null;
          const banner = document.getElementById('pwa-install-banner');
          if (banner) banner.style.display = 'none';
        });
      } else {
        // Helpful fallback prompt if already installed or on iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          alert('To install on your iPhone / iPad:\n\n1. Tap the Share button (square with arrow) at the bottom.\n2. Scroll down and tap "Add to Home Screen".');
        } else {
          alert('To install this app on your Android phone:\n\n1. Tap the Chrome menu (3 dots at top right).\n2. Tap "Install app" or "Add to Home screen".');
        }
      }
    };

    window.dismissPwaBanner = function() {
      sessionStorage.setItem('pwa_dismissed', 'true');
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.style.display = 'none';
    };

    window.addEventListener('appinstalled', () => {
      console.log('PWA was installed successfully');
      deferredPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.style.display = 'none';
    });

    // Global in-browser Fast OCR Engine with Pre-warming and Multi-Slice Spatial Extraction
    let _tessWorker = null;
    let _tessWorkerPromise = null;

    async function initTesseractWorker() {
      if (_tessWorker) return _tessWorker;
      if (_tessWorkerPromise) return _tessWorkerPromise;

      _tessWorkerPromise = (async () => {
        try {
          if (typeof Tesseract === 'undefined') return null;
          console.log('[Bill OCR] Pre-warming Tesseract worker...');
          const worker = await Tesseract.createWorker('eng', 1, {
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
            corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core.wasm.js',
            logger: m => {
              if (m.status === 'recognizing text') {
                console.log('[Bill OCR]', Math.round((m.progress || 0) * 100) + '%');
              }
            }
          });
          _tessWorker = worker;
          console.log('[Bill OCR] Worker initialized & ready for instant scans.');
          return worker;
        } catch (e) {
          console.warn('[Bill OCR] Worker initialization error:', e);
          return null;
        }
      })();
      return _tessWorkerPromise;
    }

    // Pre-warm silently in background 1.5s after page load
    window.addEventListener('load', () => {
      setTimeout(() => { initTesseractWorker(); }, 1500);
    });

    window.extractBillTextFromBase64 = async function(base64Data, callback) {
      try {
        let src = base64Data;
        if (!src.startsWith('data:')) {
          src = 'data:image/jpeg;base64,' + base64Data;
        }

        // 1. Load image into an HTML image object
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('Failed to load bill image'));
          img.src = src;
        });

        // 2. Downscale to optimal dimensions for fast & crisp OCR (max dimension 1200px)
        const maxDim = 1200;
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);

        // 3. Contrast stretch & grayscale for clean character definition
        try {
          const imgData = ctx.getImageData(0, 0, w, h);
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            let gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            // Stretch contrast
            gray = (gray - 128) * 1.35 + 128;
            if (gray < 0) gray = 0;
            if (gray > 255) gray = 255;
            d[i] = gray;
            d[i + 1] = gray;
            d[i + 2] = gray;
          }
          ctx.putImageData(imgData, 0, 0);
        } catch (_) {}

        // 4. Spatial Slice 1: Header (Top 42% -> Invoice No, Date, Distributor, Customer Name)
        const headerCanvas = document.createElement('canvas');
        headerCanvas.width = w;
        headerCanvas.height = Math.round(h * 0.42);
        const hCtx = headerCanvas.getContext('2d');
        hCtx.drawImage(canvas, 0, 0, w, headerCanvas.height, 0, 0, w, headerCanvas.height);

        // 5. Spatial Slice 2: Footer (Bottom 32% -> Subtotal, Taxes, Grand Total, Net Payable)
        const footerStartY = Math.round(h * 0.68);
        const footerH = h - footerStartY;
        const footerCanvas = document.createElement('canvas');
        footerCanvas.width = w;
        footerCanvas.height = footerH;
        const fCtx = footerCanvas.getContext('2d');
        fCtx.drawImage(canvas, 0, footerStartY, w, footerH, 0, 0, w, footerH);

        const worker = await initTesseractWorker();

        let headerText = '';
        let footerText = '';
        let fullText = '';

        if (worker) {
          // Parallel OCR across slices for maximum speed & spatial fidelity
          const [hRes, fRes, fullRes] = await Promise.all([
            worker.recognize(headerCanvas),
            worker.recognize(footerCanvas),
            worker.recognize(canvas)
          ]);
          headerText = hRes?.data?.text || '';
          footerText = fRes?.data?.text || '';
          fullText = fullRes?.data?.text || '';
        } else if (typeof Tesseract !== 'undefined') {
          const res = await Tesseract.recognize(canvas, 'eng');
          fullText = res?.data?.text || '';
        }

        if (callback) {
          callback(JSON.stringify({
            text: fullText,
            headerText: headerText,
            footerText: footerText
          }));
        }
      } catch (err) {
        console.error('OCR processing error:', err);
        if (callback) callback(JSON.stringify({ error: err ? err.toString() : 'Unknown OCR error' }));
      }
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
