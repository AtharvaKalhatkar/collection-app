<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/collection-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Daily Collection & Invoicing - Purva Enterprises & Manas Sales">

  <!-- Android / Chrome PWA Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1E3A8A">
  <meta name="msapplication-navbutton-color" content="#1E3A8A">

  <!-- iOS Safari PWA Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Collection">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Daily Collection App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* PWA Install Banner Styling */
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 16px;
      right: 16px;
      max-width: 420px;
      margin: 0 auto;
      background: #0F172A;
      border: 1px solid #334155;
      color: #FFFFFF;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 9999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      align-items: center;
      justify-content: space-between;
      animation: pwaSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pwaSlideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .pwa-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow: hidden;
    }
    .pwa-left img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      flex-shrink: 0;
      border: 1px solid #334155;
    }
    .pwa-text {
      overflow: hidden;
    }
    .pwa-title {
      font-weight: 700;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: ellipsis;
    }
    .pwa-desc {
      font-size: 11px;
      color: #94A3B8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: ellipsis;
    }
    .pwa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .pwa-btn-install {
      background: #10B981;
      color: #FFFFFF;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .pwa-btn-close {
      background: transparent;
      color: #94A3B8;
      border: none;
      font-size: 16px;
      padding: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body style="margin:0; background:#0F172A;">

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner">
    <div class="pwa-left">
      <img src="icons/Icon-192.png" alt="App Icon">
      <div class="pwa-text">
        <div class="pwa-title">Install Collection App</div>
        <div class="pwa-desc">Add to Home Screen for 1-tap fast access</div>
      </div>
    </div>
    <div class="pwa-actions">
      <button class="pwa-btn-install" onclick="window.installPwa()">INSTALL</button>
      <button class="pwa-btn-close" onclick="window.dismissPwaBanner()">✕</button>
    </div>
  </div>

  <script>
    // Register PWA Service Worker for Offline & Installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(function(reg) {
            console.log('Daily Collection PWA ServiceWorker registered');
          })
          .catch(function(err) {
            console.warn('PWA ServiceWorker registration error: ', err);
          });
      });
    }

    // PWA Install Prompt Handler
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      // Prevent browser's mini-infobar from abruptly appearing
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA: beforeinstallprompt captured!');

      // Check if user has previously dismissed banner in this session
      if (!sessionStorage.getItem('pwa_dismissed')) {
        const banner = document.getElementById('pwa-install-banner');
        if (banner) {
          banner.style.display = 'flex';
        }
      }
    });

    window.installPwa = function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('PWA: User accepted install');
          }
          deferredPrompt = null;
          const banner = document.getElementById('pwa-install-banner');
          if (banner) banner.style.display = 'none';
        });
      } else {
        // Helpful fallback prompt if already installed or on iOS
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIOS) {
          alert('To install on your iPhone / iPad:\n\n1. Tap the Share button (square with arrow) at the bottom.\n2. Scroll down and tap "Add to Home Screen".');
        } else {
          alert('To install this app on your Android phone:\n\n1. Tap the Chrome menu (3 dots at top right).\n2. Tap "Install app" or "Add to Home screen".');
        }
      }
    };

    window.dismissPwaBanner = function() {
      sessionStorage.setItem('pwa_dismissed', 'true');
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.style.display = 'none';
    };

    window.addEventListener('appinstalled', () => {
      console.log('PWA was installed successfully');
      deferredPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.style.display = 'none';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
